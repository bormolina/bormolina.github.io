<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Mix RGB channels to match a target colour."><title>RGB colour lab · Let’s practise</title><link rel="stylesheet" href="../styles.css"><script src="../app.js" defer></script></head>
<body data-app="rgb-colour-lab"><header class="app-header"><a class="back-link" href="../">← Unit 2 activities</a><span class="progress">7 / 12</span></header><main><p class="lesson-label">Let’s practise · RGB colour lab</p><h1>Match the target colour</h1><p class="intro">Adjust each channel from 0 to 255. Your colour does not need to be exact, just reasonably close.</p><section class="exercise"><div class="colour-layout"><div><div class="swatch" id="target-colour"></div><p class="swatch-label">Target colour</p></div><div><div class="swatch" id="your-colour"></div><p class="swatch-label">Your colour</p></div></div><form class="answer-form" id="answer-form"><div class="slider-field"><label for="red">R</label><input id="red" type="range" min="0" max="255" value="128"><input id="red-number" type="number" min="0" max="255" value="128" aria-label="Red value"></div><div class="slider-field"><label for="green">G</label><input id="green" type="range" min="0" max="255" value="128"><input id="green-number" type="number" min="0" max="255" value="128" aria-label="Green value"></div><div class="slider-field"><label for="blue">B</label><input id="blue" type="range" min="0" max="255" value="128"><input id="blue-number" type="number" min="0" max="255" value="128" aria-label="Blue value"></div><button type="submit" class="next-button">Check colour</button></form><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div id="extra"></div><div class="actions"><button class="next-button" id="next-button" type="button" hidden>New target →</button></div><div id="challenge" hidden></div></section></main></body></html>
