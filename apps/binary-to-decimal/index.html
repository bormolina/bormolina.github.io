<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An interactive exercise for learning how to convert binary numbers to decimal."
    />
    <title>Binary to Decimal — Borja Molina Zea</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <a class="back-link" href="../../" aria-label="Back to all resources">← Resources</a>
      <div class="header-actions">
        <button class="next-button" id="next-button" type="button" hidden>
          Next <span aria-hidden="true">→</span>
        </button>
        <button class="icon-button" id="settings-button" type="button" aria-label="Open settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.94 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.57 15 1.7 1.7 0 0 0 3 14H3v-4h.08A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88L4.2 7l2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.57 1.7 1.7 0 0 0 10 3V3h4v.08A1.7 1.7 0 0 0 15.06 4.6a1.7 1.7 0 0 0 1.88-.34L17 4.2 19.83 7l-.06.06A1.7 1.7 0 0 0 19.43 9 1.7 1.7 0 0 0 21 10h.08v4H21a1.7 1.7 0 0 0-1.6 1Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <p class="lesson-label">Binary to decimal</p>
      <h1>What is this number in decimal?</h1>

      <section class="exercise" aria-label="Binary conversion exercise">
        <div class="bits" id="bits" aria-label="Binary number"></div>
        <div class="sum" id="sum" aria-live="polite"></div>

        <form id="answer-form" novalidate>
          <label for="answer">Your answer</label>
          <div class="answer-row">
            <input
              id="answer"
              name="answer"
              type="number"
              min="0"
              step="1"
              inputmode="numeric"
              autocomplete="off"
              required
            />
            <button type="submit">Check answer</button>
          </div>
        </form>

        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      </section>
    </main>

    <dialog id="settings-dialog">
      <form id="settings-form">
        <div class="dialog-heading">
          <h2>Settings</h2>
          <button class="close-button" id="close-settings" type="button" aria-label="Close settings">×</button>
        </div>
        <p>Choose the range of bit lengths used in the exercises.</p>
        <div class="settings-fields">
          <label>
            Minimum bits
            <input id="min-bits" name="min-bits" type="number" min="1" max="16" value="4" required />
          </label>
          <label>
            Maximum bits
            <input id="max-bits" name="max-bits" type="number" min="1" max="16" value="8" required />
          </label>
        </div>
        <p class="settings-error" id="settings-error" role="alert"></p>
        <button class="save-button" type="submit">Save and start</button>
      </form>
    </dialog>
  </body>
</html>
